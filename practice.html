<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
.main{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 20px;
    border: 2px solid black;
    padding: 20px;
}

.Son{
    background-color: blue;
  text-align: center;
  padding: 20px;
}

.Daughter{
background-color: red;
text-align: center;
padding: 20px;
}

</style>


</head>
<body>
<div class="main">

<div class="Son">A </div>
<div class="Daughter">B</div>
<div class="Son">C</div>
<div class="Daughter">D</div>
<div class="Son">E</div>
<div class="Daughter">F</div>
<div class="Son">G</div>
<div class="Daughter">H</div>


</div>
</body>
</html>
